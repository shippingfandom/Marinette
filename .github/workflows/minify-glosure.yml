name: Minify Glosure Files

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  minify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Clone Riddle
        run: git clone https://github.com/shippingfandom/Riddle.git /tmp/riddle

      - name: Install dependencies
        run: pip install -r /tmp/riddle/requirements.txt

      - name: Extract versions
        id: versions
        shell: bash
        run: |
          SHELL_VER=$(awk -F"'" '/def SHELL-GLS-VERSION/{print $2}' glosure/5hell.gls)
          MARI_VER=$(awk -F"'" '/def MARINETTE-GLS-VERSION/{print $2}' glosure/marinette.gls)
          echo "shell_ver=$SHELL_VER" >> $GITHUB_OUTPUT
          echo "mari_ver=$MARI_VER" >> $GITHUB_OUTPUT

      - name: Minify 5hell.gls
        run: python /tmp/riddle/riddle.py --minify-glosure glosure/5hell.gls dist/5hell.gls

      - name: Minify marinette.gls
        run: python /tmp/riddle/riddle.py --minify-glosure glosure/marinette.gls dist/marinette.gls

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
          SHELL_VER: ${{ steps.versions.outputs.shell_ver }}
          MARI_VER: ${{ steps.versions.outputs.mari_ver }}
        run: |
          TAG="5hell-v${SHELL_VER},marinette-v${MARI_VER}"
          NAME="5hell v${SHELL_VER}, marinette v${MARI_VER}"
          BODY="These are 5hell.gls v${SHELL_VER} and marinette.gls v${MARI_VER} minified for faster loading times! <3"

          gh release delete "$TAG" --yes 2>/dev/null || true
          git tag -d "$TAG" 2>/dev/null || true
          git push origin --delete "$TAG" 2>/dev/null || true

          gh release create "$TAG" \
            "dist/5hell.gls" \
            "dist/marinette.gls" \
            --title "$NAME" \
            --notes "$BODY"
